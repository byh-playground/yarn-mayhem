name: Verify source and deploy Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Syntax and source checks
        run: |
          node --check src/main.js
          node --check src/visual/matrix.js
          test -s assets/active-theme/manifest.json
          git diff --check
      - name: Publish original files without game build
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R src _site/src
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Publish bloom-game.json with the Nightly tag name
        run: |
          curl -fsS https://raw.githubusercontent.com/byh-playground/bloom-world/main/playground/bloom-game.schema.json -o "$RUNNER_TEMP/schema.json"
          STAMP=$(date -u -d "@$(git show -s --format=%ct "$GITHUB_SHA")" +%Y%m%dT%H%M%SZ)
          jq --arg t "nightly-$STAMP-${GITHUB_SHA:0:12}" '. + {nightly:$t}' bloom-game.json > _site/bloom-game.json
          npx --yes ajv-cli@5 validate --spec=draft2020 -s "$RUNNER_TEMP/schema.json" -d _site/bloom-game.json
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
